syntax = "proto3";

package objectforge;

service ObjectForgePipeline {
  rpc GetPipelineStatus (StatusRequest) returns (stream StatusUpdate);
  rpc ProcessFrame (FrameRequest) returns (FrameResponse);
}

message StatusRequest {
  string client_id = 1;
}

message StatusUpdate {
  enum State {
    UNKNOWN = 0;
    IDLE = 1;
    PROCESSING = 2;
    COMPLETED = 3;
    ERROR = 4;
  }
  State state = 1;
  string message = 2;
  float progress_percentage = 3;
}

message FrameRequest {
  int64 timestamp_ms = 1;
  bytes image_data = 2; // Compressed JPEG/PNG bytes
  int32 width = 3;
  int32 height = 4;
}

message BoundingBox {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  string label = 5;
  float confidence = 6;
}

message FrameResponse {
  int64 timestamp_ms = 1;
  repeated BoundingBox detected_objects = 2;
}